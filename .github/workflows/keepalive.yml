name: Keepalive

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update heartbeat file
        run: |
          mkdir -p .github
          date -u +"Last keepalive run: %Y-%m-%dT%H:%M:%SZ" > .github/KEEPALIVE.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/KEEPALIVE.md
          git diff --staged --quiet || git commit -m "chore: keepalive heartbeat"
          git push
