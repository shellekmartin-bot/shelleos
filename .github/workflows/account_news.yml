name: Account News Monitor — John Stallings

on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test run — sends to Shelle instead of John'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r shelleOS/requirements_account_monitor.txt

      - name: Run monitor (scheduled — live to John)
        if: github.event_name == 'schedule'
        run: python shelleOS/account_news_monitor.py
          --accounts-file shelleOS/accounts/john_stallings.txt
          --recipient John.stallings@datasite.com
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM:         ${{ secrets.GMAIL_FROM }}

      - name: Run monitor (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          DRY_FLAG=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY_FLAG="--dry-run"
          python shelleOS/account_news_monitor.py \
            --accounts-file shelleOS/accounts/john_stallings.txt \
            --recipient John.stallings@datasite.com \
            $DRY_FLAG
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM:         ${{ secrets.GMAIL_FROM }}
